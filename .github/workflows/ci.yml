name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  taskctl-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Run taskctl unit and workflow integration tests
        run: python3 -m unittest discover -s skills/execute-tasks/tests -p 'test_*.py' -v
      - name: Run issue order tests
        run: python3 -m unittest discover -s skills/order-issues/tests -p 'test_*.py' -v
      - name: Compile scripts
        run: python3 -m py_compile skills/execute-tasks/scripts/taskctl.py skills/order-issues/scripts/issue_order.py
